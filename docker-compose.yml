name: cipher-workbench

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.deploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.deploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks:
      - application

  migrate:
    build:
      context: ${BACKEND_CONTEXT:-../caesar-cipher-be}
      dockerfile: Dockerfile
    image: cipher-workbench-backend:${BACKEND_IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.deploy}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    networks:
      - application

  backend:
    image: cipher-workbench-backend:${BACKEND_IMAGE_TAG:-local}
    pull_policy: never
    labels:
      org.opencontainers.image.revision: ${BACKEND_REVISION:-c314fa87bb87ad42ea10cd4fd96889ca176bfe26}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.deploy}
      HISTORY_API_ENABLED: ${HISTORY_API_ENABLED:-false}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: ${BACKEND_CPUS:-1.0}
    mem_limit: ${BACKEND_MEMORY:-512m}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          body = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2));
          assert body['result']['database'] == 'ok'
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging: *default-logging
    networks:
      - application

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_REVISION: ${FRONTEND_REVISION:-unknown}
        VITE_ENABLE_HILL: ${VITE_ENABLE_HILL:-false}
        VITE_ENABLE_DES: ${VITE_ENABLE_DES:-false}
        VITE_ENABLE_RSA: ${VITE_ENABLE_RSA:-false}
    image: cipher-workbench-frontend:${FRONTEND_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: ${FRONTEND_CPUS:-0.5}
    mem_limit: ${FRONTEND_MEMORY:-128m}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging: *default-logging
    networks:
      - application

networks:
  application:
    driver: bridge

volumes:
  postgres_data:
