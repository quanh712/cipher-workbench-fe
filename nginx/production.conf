limit_req_zone $binary_remote_addr zone=cipher_inner_text:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cipher_inner_file:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=cipher_inner_docs:10m rate=5r/s;

upstream cipher_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 65m;
    limit_req_status 429;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"success":false,"message":"Bạn gửi quá nhiều yêu cầu. Vui lòng thử lại sau."}';
    }

    location ~ ^/api/[^/]+/file$ {
        limit_req zone=cipher_inner_file burst=4 nodelay;
        proxy_pass http://cipher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=cipher_inner_text burst=20 nodelay;
        proxy_pass http://cipher_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location = /docs {
        limit_req zone=cipher_inner_docs burst=10 nodelay;
        proxy_pass http://cipher_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /docs/ {
        limit_req zone=cipher_inner_docs burst=10 nodelay;
        proxy_pass http://cipher_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }

    location = /openapi.json {
        limit_req zone=cipher_inner_docs burst=10 nodelay;
        proxy_pass http://cipher_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
