# Local FE 18081: DH and RSA signatures use the current BE; other APIs keep their existing backend.
services:
  frontend:
    image: cipher-workbench-frontend:algorithm-names-20261013
    ports:
      # Funnel ingress port on the host (proxy_protocol listener 8081 inside
      # the container). tailscale funnel --proxy-protocol=1 18085.
      - "127.0.0.1:${APP_FUNNEL_PORT:-18085}:8081"
    volumes:
      - ./deploy/nginx.18081-dh.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application
      - dh_backend
networks:
  dh_backend:
    external: true
    name: cipher-workbench-be_default
