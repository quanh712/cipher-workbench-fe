# Local FE 18081: every API and history request uses the same current BE.
# Legacy filename/network key retained for the existing wrapper and Docker network.
services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set verified FRONTEND_IMAGE in .env.sqlite}
    volumes:
      - ./deploy/nginx.18081-dh.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - application
      - dh_backend
networks:
  dh_backend:
    external: true
    name: cipher-workbench-be_default
